name: NRFI Daily Picks

on:
  schedule:
    - cron: "0 13 * * *"   # targets 11am ET — scheduled 2hrs early to account for GitHub queue delay
    - cron: "0 15 * * *"   # targets 1pm ET
    - cron: "0 17 * * *"   # targets 3pm ET
  workflow_dispatch:         # allows manual trigger from GitHub UI

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York   # fixes datetime.now() returning ET instead of UTC

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Set up Python
        uses: actions/setup-python@v5
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NRFI model and notify
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python notify_nrfi.py
